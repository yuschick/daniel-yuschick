# The same checks AGENTS.md asks of every change, run on every pull request
# and again on main after each merge. Branch protection on main requires the
# `checks` job, so a pull request can't merge while it's red.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels its run in progress; runs on main
# always finish, so every merge gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs, so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Storybook stories run as tests in a real Chromium (FS-05, A11Y-14).
      - name: Install Chromium for Storybook tests
        run: pnpm --filter @dy/storybook exec playwright install --with-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, type-check, build and test
        run: pnpm turbo run lint check-types build test --ui=stream

      # The skills' own scripts and their seeded defects, so a change to a check
      # that stops it catching anything can't merge. Not a workspace package, so
      # Turborepo doesn't run them.
      - name: Test the skills
        run: node --test .claude/skills/*/scripts/*.test.js

      # Merging a spec approves it, so every spec must be ready to build: valid
      # against its facts and the built tokens, with no open questions and no
      # `status` field claiming approval. Runs after the build, which writes
      # the token manifest the check reads.
      - name: Check specs are ready to approve
        # Checks every spec before failing, so one run reports them all.
        run: |
          failed=0
          for spec in packages/react/specs/*/*.md; do
            echo "::group::$spec"
            node .claude/skills/spec/scripts/check-spec.js --ready \
              --spec "$spec" --facts "${spec%.md}.facts.json" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
